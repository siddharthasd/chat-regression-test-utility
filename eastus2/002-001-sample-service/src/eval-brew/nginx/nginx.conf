worker_processes auto;
events { worker_connections 1024; }
http {
    upstream harness_app { server 127.0.0.1:8000; keepalive 32; }
    server {
        listen 80;
        server_name _;
        client_max_body_size 50M;
        location /static/ {
            alias /app/src/harness/ui/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        location / {
            proxy_pass http://harness_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }

    # ── TLS configuration ────────────────────────────────────────────────────
    # Cloud deployments (Azure Container Apps, AWS ALB, GCP Load Balancer):
    #   terminate TLS at the load balancer/Application Gateway and leave the
    #   port 80 server block above pointing to the upstream. nginx stays on
    #   the VNet and never sees public HTTPS traffic.
    #
    # Self-hosted / on-prem with nginx as the edge:
    #   1. Provision a certificate (e.g. Let's Encrypt / certbot).
    #   2. Uncomment the HTTPS server block below and fill in cert paths.
    #   3. Replace the port 80 server block above with the HTTP→HTTPS redirect.
    #
    # server {
    #     listen 443 ssl;
    #     server_name _;
    #     ssl_certificate     /etc/ssl/certs/harness.crt;
    #     ssl_certificate_key /etc/ssl/private/harness.key;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #     client_max_body_size 50M;
    #     location /static/ {
    #         alias /app/src/harness/ui/static/;
    #         expires 1y;
    #         add_header Cache-Control "public, immutable";
    #     }
    #     location / {
    #         proxy_pass http://harness_app;
    #         proxy_http_version 1.1;
    #         proxy_set_header Connection "";
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #         proxy_read_timeout 120s;
    #     }
    # }
    #
    # HTTP → HTTPS redirect (replaces the port 80 block above when TLS is active):
    # server {
    #     listen 80;
    #     server_name _;
    #     return 301 https://$host$request_uri;
    # }
}
