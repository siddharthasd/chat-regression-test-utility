{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="mb-4">
  <a href="{{ url_for('index') }}" class="text-muted text-decoration-none small">
    <svg width="12" height="12" fill="currentColor" class="me-1" viewBox="0 0 16 16">
      <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/>
    </svg>
    Dashboard
  </a>
</div>

<div class="card shadow-sm border-0">
  <div class="card-body p-4 p-lg-5">
    <div id="md-content" class="docs-body"></div>
  </div>
</div>

<!-- SVG topology diagram — hidden until JS moves it into position after marked renders -->
<div id="topology-svg-wrap" style="display:none" aria-label="High-level runtime topology diagram">
  <figure class="topology-figure">
    <svg width="840" height="500" viewBox="0 0 840 500"
         xmlns="http://www.w3.org/2000/svg"
         font-family="Arial, sans-serif" font-size="13" fill="#212529"
         role="img" aria-labelledby="topo-title">
      <title id="topo-title">EvalBrew high-level runtime topology</title>

      <defs>
        <marker id="arr" markerWidth="8" markerHeight="7" refX="7" refY="3.5" orient="auto">
          <polygon points="0 0, 8 3.5, 0 7" fill="#6c757d"/>
        </marker>
      </defs>

      <!-- ══ HARNESS SERVER CONTAINER ══ -->
      <rect x="205" y="12" width="440" height="368" rx="10"
            fill="#f8f9fa" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="7,4"/>
      <text x="425" y="34" text-anchor="middle" font-size="11" font-weight="700"
            fill="#6c757d" letter-spacing="2">HARNESS SERVER</text>

      <!-- Nginx -->
      <rect x="232" y="48" width="386" height="46" rx="6"
            fill="#fff3e0" stroke="#fb8c00" stroke-width="1.5"/>
      <text x="425" y="67" text-anchor="middle" font-weight="700" fill="#e65100">Nginx</text>
      <text x="425" y="84" text-anchor="middle" font-size="11" fill="#795548">reverse proxy · TLS offload · static files</text>

      <!-- Uvicorn -->
      <rect x="232" y="128" width="386" height="46" rx="6"
            fill="#e8f5e9" stroke="#43a047" stroke-width="1.5"/>
      <text x="425" y="147" text-anchor="middle" font-weight="700" fill="#2e7d32">Uvicorn 0.30+</text>
      <text x="425" y="164" text-anchor="middle" font-size="11" fill="#388e3c">ASGI server · --factory mode · Python 3.13</text>

      <!-- FastAPI application box -->
      <rect x="232" y="208" width="386" height="148" rx="6"
            fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
      <text x="425" y="230" text-anchor="middle" font-weight="700" fill="#1a237e">FastAPI 0.115+ Application</text>
      <line x1="240" y1="238" x2="610" y2="238" stroke="#c5cae9" stroke-width="1"/>
      <text x="255" y="258" fill="#3949ab" font-size="12">▸  UI Routers  (Jinja2 · Bootstrap 5)</text>
      <text x="255" y="278" fill="#3949ab" font-size="12">▸  Auth Middleware  (MSAL · PyJWT RS256)</text>
      <text x="255" y="298" fill="#3949ab" font-size="12">▸  Headless API  /api/headless/*</text>
      <text x="255" y="318" fill="#3949ab" font-size="12">▸  Orchestrator Engine  (daemon threads)</text>
      <text x="255" y="344" fill="#7986cb" font-size="11" font-style="italic">httpx (sync) — connector &amp; evaluator calls</text>

      <!-- ══ EXTERNAL CALLERS (left) ══ -->
      <rect x="10" y="72" width="165" height="52" rx="6"
            fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
      <text x="92" y="93" text-anchor="middle" font-weight="700" fill="#1a237e">qual-brew</text>
      <text x="92" y="111" text-anchor="middle" font-size="11" fill="#5c6bc0">M2M Bearer JWT</text>

      <rect x="10" y="165" width="165" height="52" rx="6"
            fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
      <text x="92" y="186" text-anchor="middle" font-weight="700" fill="#1a237e">Browser</text>
      <text x="92" y="204" text-anchor="middle" font-size="11" fill="#5c6bc0">HTTPS / SSO</text>

      <!-- ══ EXTERNAL SERVICES (bottom) ══ -->
      <rect x="10" y="418" width="165" height="52" rx="6"
            fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.5"/>
      <text x="92" y="439" text-anchor="middle" font-weight="700" fill="#4a148c">YOUR CONNECTOR</text>
      <text x="92" y="458" text-anchor="middle" font-size="11" fill="#7b1fa2">POST /endpoint</text>

      <rect x="330" y="418" width="190" height="52" rx="6"
            fill="#fce4ec" stroke="#e53935" stroke-width="1.5"/>
      <text x="425" y="439" text-anchor="middle" font-weight="700" fill="#b71c1c">PostgreSQL</text>
      <text x="425" y="458" text-anchor="middle" font-size="11" fill="#c62828">PaaS · psycopg2 2.9+</text>

      <rect x="660" y="418" width="170" height="52" rx="6"
            fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.5"/>
      <text x="745" y="439" text-anchor="middle" font-weight="700" fill="#4a148c">YOUR EVALUATOR</text>
      <text x="745" y="458" text-anchor="middle" font-size="11" fill="#7b1fa2">POST /endpoint</text>

      <!-- ══ ARROWS ══ -->
      <!-- qual-brew ──L-path──► Nginx -->
      <path d="M 175 98 L 205 98 L 205 71 L 232 71"
            fill="none" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arr)"/>

      <!-- Browser ──L-path──► Nginx -->
      <path d="M 175 191 L 205 191 L 205 83 L 232 83"
            fill="none" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arr)"/>

      <!-- Nginx ──► Uvicorn -->
      <path d="M 425 94 L 425 128"
            fill="none" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arr)"/>

      <!-- Uvicorn ──► FastAPI -->
      <path d="M 425 174 L 425 208"
            fill="none" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arr)"/>

      <!-- FastAPI ──httpx──► Connector (dashed) -->
      <path d="M 300 356 L 300 400 L 92 400 L 92 418"
            fill="none" stroke="#6c757d" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
      <text x="200" y="395" text-anchor="middle" font-size="10" fill="#9e9e9e">httpx</text>

      <!-- FastAPI ──► PostgreSQL -->
      <path d="M 425 356 L 425 418"
            fill="none" stroke="#6c757d" stroke-width="1.5" marker-end="url(#arr)"/>

      <!-- FastAPI ──httpx──► Evaluator (dashed) -->
      <path d="M 550 356 L 550 400 L 745 400 L 745 418"
            fill="none" stroke="#6c757d" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
      <text x="648" y="395" text-anchor="middle" font-size="10" fill="#9e9e9e">httpx</text>
    </svg>
    <figcaption>Fig 1 — High-level runtime topology. Solid lines = synchronous calls; dashed lines = httpx HTTP calls to external services.</figcaption>
  </figure>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/marked@13/marked.min.js"
        integrity="sha384-YTBHtsL8yVTHcLakYNyrOfK3K+QQcXiECuaALJ+3j7Mo681Rtzadt8NR6WrZH+eQ"
        crossorigin="anonymous"></script>
<script>
  const raw = {{ markdown_content | tojson }};
  document.getElementById('md-content').innerHTML = marked.parse(raw);

  // Swap the ASCII topology code block with the SVG diagram
  const headings = document.querySelectorAll('#md-content h2');
  for (const h of headings) {
    if (h.textContent.includes('runtime topology')) {
      const pre = h.nextElementSibling;
      if (pre && pre.tagName === 'PRE') {
        const wrap = document.getElementById('topology-svg-wrap');
        wrap.removeAttribute('style');
        pre.replaceWith(wrap);
      }
      break;
    }
  }
</script>
<style>
  .docs-body { max-width: 900px; }
  .docs-body h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; }
  .docs-body h2 { font-size: 1.3rem; font-weight: 600; margin-top: 2rem; margin-bottom: 0.5rem; border-bottom: 1px solid #dee2e6; padding-bottom: 0.25rem; }
  .docs-body h3 { font-size: 1.1rem; font-weight: 600; margin-top: 1.5rem; }
  .docs-body pre { background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 6px; padding: 1rem; overflow-x: auto; }
  .docs-body code { background: #f1f3f5; border-radius: 3px; padding: 0.15em 0.35em; font-size: 0.875em; }
  .docs-body pre code { background: none; padding: 0; font-size: 0.85em; }
  .docs-body table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
  .docs-body th, .docs-body td { border: 1px solid #dee2e6; padding: 0.5rem 0.75rem; text-align: left; }
  .docs-body th { background: #f8f9fa; font-weight: 600; }
  .docs-body blockquote { border-left: 4px solid #3949ab; padding-left: 1rem; color: #6c757d; margin-left: 0; }
  .docs-body ul, .docs-body ol { padding-left: 1.5rem; }
  .docs-body a { color: #3949ab; }

  .topology-figure { margin: 1.5rem 0 2rem; }
  .topology-figure svg { max-width: 100%; height: auto; display: block; }
  .topology-figure figcaption { font-size: 0.8rem; color: #6c757d; margin-top: 0.5rem; }
</style>
{% endblock %}
