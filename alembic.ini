# Alembic configuration. The runtime path (init_db) builds its Config
# programmatically and injects the live engine; this file supports the
# `alembic` CLI (e.g. `alembic revision --autogenerate`) from the repo root.

[alembic]
script_location = src/harness/persistence/migrations
# Overridden at runtime by init_db(); used by the CLI for autogenerate.
sqlalchemy.url = sqlite:///%(here)s/.harness-dev.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
