{% extends "base.html" %}
{% block title %}Sign In{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-5 text-center">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" class="mb-3" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 2h4v6l7 12Q22 22 19.5 22H4.5Q2 22 3 20l7-12Z"
                fill="#1a237e" fill-opacity="0.12" stroke="#1a237e" stroke-width="1.4" stroke-linejoin="round"/>
          <circle cx="9.5" cy="16.5" r="1.1" fill="#1a237e" opacity="0.85"/>
          <circle cx="13.5" cy="14.5" r="0.8" fill="#1a237e" opacity="0.65"/>
          <circle cx="11.5" cy="19.2" r="0.7" fill="#1a237e" opacity="0.65"/>
        </svg>
        <h4 class="mb-1 fw-bold">Eval<span style="color:#283593">Brew</span></h4>
        <p class="text-muted mb-4">Sign in with your Accenture Microsoft account to continue.</p>
        <a href="{{ url_for('login') }}" class="btn btn-primary btn-lg w-100">
          <svg width="18" height="18" fill="currentColor" class="me-2" viewBox="0 0 16 16">
            <path d="M7.5 1v7h1V1z"/>
            <path d="M3 8.812a4.999 4.999 0 0 1 2.578-4.375l-.485-.874A6 6 0 1 0 11 3.616l-.501.865A5 5 0 1 1 3 8.812"/>
          </svg>
          Sign in with Microsoft
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
