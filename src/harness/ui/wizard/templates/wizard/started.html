{% extends "base.html" %}
{% block title %}Job Started{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-lg-6">
    <div class="card shadow-sm border-0 text-center py-5">
      <div class="card-body">
        <div class="mb-3" style="font-size:3rem">✅</div>
        <h4 class="fw-bold mb-1">Job Started</h4>
        <p class="text-muted mb-4">
          <strong>{{ view.job_name }}</strong> (<code>{{ view.job_id[:8] }}</code>) is now
          <span class="badge badge-{{ view.status }}">{{ view.status }}</span>.
          The execution engine will pick it up shortly.
        </p>
        <div class="d-flex justify-content-center gap-3">
          <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">← Back to Dashboard</a>
          <a href="{{ url_for('wizard.new_job') }}" class="btn btn-outline-secondary">Create another job</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
