[project]
name = "agent-regression-test-utility"
version = "0.1.0"
description = "Agent Regression Test Utility — regression testing for AI chatbots/agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "starlette>=0.41",
    "click>=8.1",
    "structlog>=24.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "cryptography>=42.0",
    "jsonschema>=4.21",
    "httpx>=0.27",
    "msal>=1.28",
    "PyJWT[crypto]>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
harness = "harness.cli:harness_group"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"harness.contract.schemas" = ["*.json"]
"harness.ui" = ["templates/*.html", "static/*.css"]
"harness.ui.dashboard" = ["templates/dashboard/*.html"]
"harness.ui.detail" = ["templates/detail/*.html"]
"harness.ui.connector_registry" = ["templates/connector_registry/*.html"]
"harness.ui.evaluator_registry" = ["templates/evaluator_registry/*.html"]
"harness.ui.wizard" = ["templates/wizard/*.html"]
"harness.ui.auth" = ["templates/auth/*.html"]
"harness.ui.admin" = ["templates/admin/*.html"]
"harness.ui.docs_ui" = ["templates/docs/*.html"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SLF"]
# SLF001 = "Private member accessed"; combined with the per-file-ignores below,
# this operationalizes 010 FR-003 / SC-010: production code MUST NOT write to
# `IdentityContext._resolved` directly. The singleton itself defines the
# attribute and the bootstrap legitimately reads it for the idempotence
# guard — both use targeted `# noqa: SLF001` on the affected lines rather
# than file-wide exemption. Tests legitimately mutate it via fixtures (the
# documented test-only hatch); tests are exempted file-wide.

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["SLF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
